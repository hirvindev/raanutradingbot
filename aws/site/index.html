<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaanuBot — AWS skeleton</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d0f12;
    color: #e8edf5;
    padding: 48px 24px;
    max-width: 640px;
    margin: 0 auto;
  }
  h1 { color: #00c896; font-size: 22px; margin-bottom: 4px; }
  p { color: #8a93a8; line-height: 1.6; }
  #result {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    background: #1a1e26;
    border: 1px solid #2a3040;
    padding: 16px;
    border-radius: 8px;
    margin-top: 16px;
    white-space: pre-wrap;
    font-size: 13px;
  }
  .ok { color: #22c55e; }
  .err { color: #f43f5e; }
</style>
</head>
<body>
  <h1>RaanuBot &mdash; AWS skeleton</h1>
  <p>
    This page is served from a private S3 bucket through CloudFront.
    The block below is a live <code>fetch()</code> to a Lambda Function URL &mdash;
    if it renders JSON, the whole pipeline (CDN &rarr; browser &rarr; Lambda) works.
  </p>
  <div id="result">calling Lambda&hellip;</div>
  <script>
    fetch('./config.json')
      .then(function (r) { return r.json(); })
      .then(function (cfg) { return fetch(cfg.apiUrl); })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var el = document.getElementById('result');
        el.textContent = JSON.stringify(data, null, 2);
        el.classList.add('ok');
      })
      .catch(function (err) {
        var el = document.getElementById('result');
        el.textContent = 'Error: ' + err;
        el.classList.add('err');
      });
  </script>
</body>
</html>
