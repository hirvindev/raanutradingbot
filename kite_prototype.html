<!--
  Kite-style Overview prototype.
  Served at /kite so it can be compared against the live dashboard at / without
  touching it. Deliberately shows LESS: one summary strip, one positions table,
  one compact strategy list. Everything reference-ish (scoring tables, backtest
  results, ATR explainers, config panels) belongs on Strategy, not here.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RaanuTradingBot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f9f9f9; --card:#fff; --line:#e9e9e9; --line2:#f2f2f2;
  --text:#3c3c3c; --head:#1a1a1a; --muted:#9b9b9b;
  --blue:#387ed1; --green:#4caf50; --red:#ff5722;
  /* Strategy identity stays, but as quiet 2px rules rather than filled badges.
     Kite spends colour on P&L almost exclusively. */
  --s1:#4caf50; --s2:#f0a02e; --s3:#7b5cd6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:400 13px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--green)} .down{color:var(--red)}

/* ---- top bar : text links, blue active. no gradients, no glow ---- */
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hwrap{max-width:1180px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:28px}
.logo{font-weight:600;font-size:15px;color:var(--head);letter-spacing:-.2px}
.logo span{color:var(--blue)}
nav{display:flex;gap:22px;margin-left:auto}
nav a{color:var(--muted);text-decoration:none;font-size:13px;padding:19px 0;border-bottom:2px solid transparent}
nav a:hover{color:var(--text)}
nav a.on{color:var(--blue);border-bottom-color:var(--blue)}
.pill{margin-left:18px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:3px 8px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:1px}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

/* ---- summary strip : four numbers, no card chrome ---- */
.strip{background:var(--card);border:1px solid var(--line);border-radius:3px;display:grid;
       grid-template-columns:repeat(4,1fr);margin-bottom:22px}
.stat{padding:16px 20px;border-right:1px solid var(--line2)}
.stat:last-child{border-right:0}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat .v{font-size:22px;font-weight:400;color:var(--head);letter-spacing:-.4px}
.stat .s{font-size:11px;color:var(--muted);margin-top:3px}

h2{font-size:14px;font-weight:500;color:var(--head);margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
h2 em{font-style:normal;font-size:12px;color:var(--muted);font-weight:400}

.card{background:var(--card);border:1px solid var(--line);border-radius:3px;margin-bottom:22px}

table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:400;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;
   text-align:right;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child{text-align:left}
td{padding:11px 14px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fcfcfc}
.sym{font-weight:500;color:var(--head)}
.sub{font-size:11px;color:var(--muted);font-weight:400}
.tag{font-size:10px;color:var(--muted);border-left:2px solid var(--line);padding-left:6px}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:12px}

/* ---- strategy list : one row each, not three big cards ---- */
.srow{display:grid;grid-template-columns:150px repeat(4,1fr);gap:10px;align-items:center;
      padding:13px 16px;border-bottom:1px solid var(--line2)}
.srow:last-child{border-bottom:0}
.sname{font-weight:500;color:var(--head);border-left:2px solid var(--line);padding-left:9px}
.sk{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.sv{font-size:13px;color:var(--text);margin-top:2px}
.idle{color:var(--muted);font-size:12px;grid-column:2/-1}
@media(max-width:820px){
  .strip{grid-template-columns:repeat(2,1fr)}
  .stat{border-bottom:1px solid var(--line2)}
  .srow{grid-template-columns:1fr 1fr;gap:8px}
  nav{display:none}
}
</style>

<header>
  <div class="hwrap">
    <div class="logo">Raanu<span>Bot</span></div>
    <nav>
      <a class="on" href="#">Dashboard</a>
      <a href="/">Positions</a><a href="/">Orders</a><a href="/">Signals</a><a href="/">Strategy</a>
    </nav>
    <span class="pill" id="mode">—</span>
  </div>
</header>

<main>
  <div class="strip">
    <div class="stat"><div class="k">Portfolio value</div><div class="v num" id="pv">—</div><div class="s" id="pvs">&nbsp;</div></div>
    <div class="stat"><div class="k">Day's P&amp;L</div><div class="v num" id="day">—</div><div class="s">Since previous close</div></div>
    <div class="stat"><div class="k">Open P&amp;L</div><div class="v num" id="open">—</div><div class="s" id="opens">&nbsp;</div></div>
    <div class="stat"><div class="k">Free cash</div><div class="v num" id="cash">—</div><div class="s">Available to trade</div></div>
  </div>

  <h2>Positions <em id="poscount"></em></h2>
  <div class="card">
    <table>
      <thead><tr><th>Instrument</th><th>Strategy</th><th>Qty</th><th>Avg</th><th>LTP</th><th>Value</th><th>P&amp;L</th><th>Chg</th></tr></thead>
      <tbody id="pos"><tr><td class="empty" colspan="8">Loading…</td></tr></tbody>
    </table>
  </div>

  <h2>Strategies <em>live budget and realised record</em></h2>
  <div class="card" id="strats">
    <div class="empty">Loading…</div>
  </div>
</main>

<script>
const API = location.origin;
const S = {pos:[], cfg:{}, stats:{}};
const money = n => (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const signed = n => (n>=0?'+':'-')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cls = n => n>=0?'up':'down';
const j = async p => { try{ const r = await fetch(API+p); return r.ok ? await r.json() : null; }catch(e){ return null; } };
const STRAT = {s1:{n:'S1 Pullback',c:'var(--s1)'}, s2:{n:'S2 Breakout',c:'var(--s2)'}, s3:{n:'S3 Leader Dip',c:'var(--s3)'},
               manual:{n:'Manual',c:'var(--muted)'}};
const sof = o => STRAT[(o.strategy||'').toLowerCase()] ? (o.strategy||'').toLowerCase() : '';

function tag(k){
  const s = STRAT[k];
  // Untagged is stated plainly rather than left as a bare dash — an
  // unattributed position is unknown, which is worth reading as a word.
  if(!s) return '<span class="tag" title="No BUY for this symbol in this instance\'s trade log">Untagged</span>';
  return `<span class="tag" style="border-left-color:${s.c}">${s.n.split(' ')[0]}</span>`;
}

async function load(){
  const [acct, pos, health, cmp] = await Promise.all([
    j('/api/account/cash'), j('/api/portfolio'), j('/api/health'), j('/api/strategy/compare')
  ]);
  S.pos = pos||[]; S.cfg = (health&&health.config)||{}; S.stats = cmp||{};

  if(health) document.getElementById('mode').innerHTML =
    `<span class="dot"></span>${(health.mode||'').toUpperCase()}`;

  const openPl = S.pos.reduce((a,p)=>a+(p.ppl||0),0);
  const invested = S.pos.reduce((a,p)=>a+(p.currentPrice||p.averagePrice)*p.quantity,0);
  if(acct){
    document.getElementById('pv').textContent = money(acct.total||0);
    document.getElementById('pvs').textContent = money(invested)+' invested';
    const d = acct.daily_ppl||0;
    const de = document.getElementById('day');
    de.textContent = signed(d); de.className = 'v num '+cls(d);
    document.getElementById('cash').textContent = money(acct.free||0);
  }
  const oe = document.getElementById('open');
  oe.textContent = signed(openPl); oe.className = 'v num '+cls(openPl);
  document.getElementById('opens').textContent = S.pos.length+' position'+(S.pos.length===1?'':'s');

  renderPos(); renderStrats();
}

function renderPos(){
  document.getElementById('poscount').textContent = S.pos.length ? S.pos.length+' open' : '';
  const b = document.getElementById('pos');
  if(!S.pos.length){ b.innerHTML = '<tr><td class="empty" colspan="8">No open positions</td></tr>'; return; }
  // Flat table, sorted by size. No per-strategy block headers: with a Strategy
  // column the grouping was redundant chrome, and it is what made the bulk
  // "close all untagged" action look reasonable.
  b.innerHTML = [...S.pos].sort((x,y)=>
      (y.currentPrice||y.averagePrice)*y.quantity-(x.currentPrice||x.averagePrice)*x.quantity
    ).map(p=>{
    const ltp=p.currentPrice??p.averagePrice, pl=p.ppl??(ltp-p.averagePrice)*p.quantity;
    const pct=((ltp-p.averagePrice)/p.averagePrice)*100, val=ltp*p.quantity;
    const nm = p.name && p.name!==p.ticker ? `<div class="sub">${p.name}</div>` : '';
    return `<tr>
      <td><span class="sym">${p.ticker}</span>${nm}</td>
      <td>${tag(sof(p))}</td>
      <td class="num">${p.quantity.toFixed(2)}</td>
      <td class="num">${money(p.averagePrice)}</td>
      <td class="num">${money(ltp)}</td>
      <td class="num">${money(val)}</td>
      <td class="num ${cls(pl)}">${signed(pl)}</td>
      <td class="num ${cls(pct)}">${pct>=0?'+':''}${pct.toFixed(2)}%</td>
    </tr>`;
  }).join('');
}

function renderStrats(){
  const caps = S.cfg.per_trade_max_by_strategy||{}, lims = S.cfg.weekly_limit_by_strategy||{};
  document.getElementById('strats').innerHTML = ['s1','s2','s3'].map(k=>{
    const st = S.stats[k]||{}, meta = STRAT[k];
    const mine = S.pos.filter(p=>sof(p)===k);
    const val = mine.reduce((a,p)=>a+(p.currentPrice||p.averagePrice)*p.quantity,0);
    const closed = st.closed_trades||0, net = st.net_pnl||0;
    const budget = `${caps[k]!=null?money(caps[k]):'—'} · ${lims[k]!=null?lims[k]+'/wk':'—'}`;
    const name = `<div class="sname" style="border-left-color:${meta.c}">${meta.n}</div>`;
    // An idle strategy says so in words instead of rendering four zeros, which
    // reads as broken. S3 has never traded and that is expected.
    if(!mine.length && !closed)
      return `<div class="srow">${name}<div class="idle">No trades yet · budget ${budget}</div></div>`;
    return `<div class="srow">${name}
      <div><div class="sk">Open</div><div class="sv num">${mine.length?mine.length+' · '+money(val):'—'}</div></div>
      <div><div class="sk">Closed</div><div class="sv num">${closed||'—'}${closed?` · ${st.win_rate}%`:''}</div></div>
      <div><div class="sk">Realised</div><div class="sv num ${closed?cls(net):''}">${closed?signed(net):'—'}</div></div>
      <div><div class="sk">Budget</div><div class="sv num">${budget}</div></div>
    </div>`;
  }).join('');
}

load(); setInterval(load, 30000);
</script>
